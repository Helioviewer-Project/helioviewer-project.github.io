# Serves the site behind an existing nginx-proxy + acme-companion setup.
#
# Usage:
#   cp .env.example .env   # then set BLOG_DOMAIN
#   docker compose up -d
#
# Requires an external Docker network named "nginx-proxy" that the
# nginx-proxy container is attached to.

services:
  jekyll:
    image: jekyll/jekyll:latest
    command: >
      bash -c "echo \"url: https://$${BLOG_DOMAIN}\" > /tmp/_config.domain.yml
      && bundle install
      && bundle exec jekyll serve --watch --force_polling --host 0.0.0.0
      --config _config.yml,/tmp/_config.domain.yml"
    volumes:
      - .:/srv/jekyll
      - bundle-cache:/usr/local/bundle
    expose:
      - "4000"
    environment:
      # Otherwise `jekyll serve` overrides site.url with http://0.0.0.0:4000
      JEKYLL_ENV: production
      BLOG_DOMAIN: ${BLOG_DOMAIN}
      VIRTUAL_HOST: ${BLOG_DOMAIN:?Set BLOG_DOMAIN in .env}
      VIRTUAL_PORT: "4000"
      LETSENCRYPT_HOST: ${BLOG_DOMAIN}
    networks:
      - nginx-proxy
    restart: unless-stopped

volumes:
  bundle-cache:

networks:
  nginx-proxy:
    external: true
